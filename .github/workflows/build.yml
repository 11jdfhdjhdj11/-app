name: 打包 APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 网页上传会丢失可执行权限，这里补上
      - name: 准备 gradlew
        run: chmod +x gradlew

      - name: 单元测试
        run: ./gradlew --no-daemon testLiteDebugUnitTest

      # ---------- 标准版（系统语音） ----------
      - name: 打包标准版
        run: ./gradlew --no-daemon assembleLiteDebug

      - uses: actions/upload-artifact@v4
        with:
          name: 标准版-debug-apk
          path: app/build/outputs/apk/lite/debug/*.apk

      # ---------- 音色版（内置 Kokoro 离线音色） ----------
      - name: 缓存 Kokoro 模型
        uses: actions/cache@v4
        with:
          path: app/src/full/assets/kokoro
          key: kokoro-int8-multi-lang-v1_1

      - name: 下载 Kokoro 模型
        run: bash scripts/fetch-kokoro.sh

      - name: 打包音色版
        run: ./gradlew --no-daemon assembleFullDebug

      - uses: actions/upload-artifact@v4
        with:
          name: 音色版-debug-apk
          path: app/build/outputs/apk/full/debug/*.apk

      # ---------- 正式版：仓库配置了签名密钥（Settings → Secrets）才执行 ----------
      - name: 写入签名密钥
        id: keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: 打包正式版
        if: steps.keystore.outputs.path != ''
        env:
          SIGNING_STORE_FILE: ${{ steps.keystore.outputs.path }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleLiteRelease assembleFullRelease

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.path != ''
        with:
          name: release-apk
          path: app/build/outputs/apk/*/release/*.apk

      # 推送 v 开头的标签（如 v1.0.0）时，自动发布到 Releases 页面
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/*/debug/*.apk
            app/build/outputs/apk/*/release/*.apk
          fail_on_unmatched_files: false
